<!DOCTYPE html>
<html>

<head>
    <title>Eco Track - AI Result</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <img src="{{ url_for('static', filename='logo.jpeg') }}"
         class="logo">

    <h1>🤖 AI Waste Detection</h1>

    <p>
        <b>Uploaded file:</b>
        {{ filename }}
    </p>

    <hr>

    <div class="card">

        <h2>♻️ Detection Result</h2>

        <p>
            <b>Waste:</b>
            {{ result.waste }}
        </p>

        <p>
            <b>Waste Type:</b>
            {{ result.type }}
        </p>

        <p>
            <b>Hazardousness:</b>
            {{ result.hazard }}%
        </p>

        <p>
            <b>Recommended Bin:</b>
            {{ result.bin }}
        </p>

        <p>
            <b>Disposal Guidance:</b>
            {{ result.guidance }}
        </p>

    </div>

    <br>

    <a href="{{ url_for('helper') }}">
        <button>⬅️ Back to Helper</button>
    </a>

    <br><br>

    <a href="{{ url_for('home') }}">
        <button>🏠 Home</button>
    </a>

</body>
</html>

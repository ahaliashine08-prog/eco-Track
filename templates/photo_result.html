<!DOCTYPE html>
<html>
<head>
    <title>Eco Track - AI Waste Result</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <img src="{{ url_for('static', filename='logo.jpeg') }}"
         alt="Eco Track Logo"
         style="width: 160px;">

    <h1>🤖 AI Waste Detection</h1>

    <p>
        <b>Uploaded file:</b> {{ filename }}
    </p>

    <hr>

    <h2>♻️ Detection Result</h2>

    <p>
        <b>Waste:</b>
        {{ result.waste }}
    </p>

    <p>
        <b>Waste Type:</b>
        {{ result.type }}
    </p>

    <p>
        <b>Hazardousness:</b>
        {{ result.hazard }}%
    </p>

    <p>
        <b>Recommended Bin:</b>
        {{ result.bin }}
    </p>

    <p>
        <b>Disposal Guidance:</b>
        {{ result.guidance }}
    </p>

    <hr>

    <a href="/helper">
        <button>🔍 Detect Another Waste</button>
    </a>

    <br><br>

    <a href="/home">
        <button>🏠 Back to Dashboard</button>
    </a>

</body>
</html>

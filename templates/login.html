<!DOCTYPE html>
<html>

<head>
    <title>Eco Track - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <img src="{{ url_for('static', filename='logo.jpeg') }}"
         class="logo">

    <h1>🌱 ECO TRACK</h1>

    <h2>Login</h2>

    <form method="POST">

        <label>Username</label>

        <br><br>

        <input
            type="text"
            name="username"
            required>

        <br><br>

        <label>Password</label>

        <br><br>

        <input
            type="password"
            name="password"
            required>

        <br><br>

        <button type="submit">
            Login
        </button>

    </form>

    <br>

    <a href="{{ url_for('register') }}">
        Create a new account
    </a>

</body>
</html>

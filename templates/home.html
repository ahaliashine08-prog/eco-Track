<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Track - Citizen Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <img src="{{ url_for('static', filename='logo.png') }}"
         alt="Eco Track Logo"
         class="logo"
         style="width: 180px; height: 180px;">

    <h1>🌱 ECO TRACK</h1>

    <h2>Welcome, {{ username }}! 👋</h2>

    <hr>

    <h2>♻️ Citizen Dashboard</h2>
    <p>What would you like to do?</p>

    <div class="card">
        <a href="{{ url_for('bins') }}">
            <button>🗑️ Various Types of Bins</button>
        </a>
        <br><br>

        <a href="{{ url_for('helper') }}">
            <button>🔍 Waste Disposal Helper</button>
        </a>
        <br><br>

        <a href="{{ url_for('report') }}">
            <button>📝 Reports</button>
        </a>
        <br><br>

        <a href="{{ url_for('my_reports') }}">
            <button>📋 My Reports</button>
        </a>
    </div>

    <br>

    <a href="{{ url_for('logout') }}">
        <button>🚪 Logout</button>
    </a>

</body>
</html>
